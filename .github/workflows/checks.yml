name: Checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build:admin
      - run: pnpm --filter @event-radar/mobile deps:check
      - run: pnpm --filter @event-radar/mobile run doctor
      - run: pnpm export:mobile
      - run: APP_VARIANT=staging pnpm --filter @event-radar/mobile run config
      - run: pnpm audit:deps
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.3'
      - run: python -m pip install uv==0.12.21
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen python -m ingestion --check
      - run: APP_ENV=staging uv run --frozen python -m ingestion --check
