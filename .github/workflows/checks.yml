name: Checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build:admin
      - run: pnpm --filter @event-radar/mobile deps:check
      - run: pnpm --filter @event-radar/mobile run doctor
      - run: pnpm export:mobile
      - run: APP_VARIANT=staging pnpm --filter @event-radar/mobile run config
      - run: pnpm audit:deps
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.3'
      - run: python -m pip install uv==0.12.21
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen python -m ingestion --check
      - run: APP_ENV=staging uv run --frozen python -m ingestion --check
      - run: uv run --frozen python -m unittest discover -s . -t .
  database-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.34.3
      - run: pnpm install --frozen-lockfile
      # CLI startup prints local keys; never upload this raw log as an artifact.
      - run: supabase start > /tmp/event-radar-supabase.log 2>&1
      - run: supabase gen types typescript --local --schema public > /tmp/event-radar-types.ts
      - run: diff -u apps/mobile/src/lib/database.types.ts /tmp/event-radar-types.ts
      - run: pnpm test:s2
      - run: docker exec -i supabase_db_event-radar-local psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/s4_invariants.sql
      - run: docker exec -i supabase_db_event-radar-local psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/s3_invariants.sql
      - run: docker exec -i supabase_db_event-radar-local psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/s5_invariants.sql
      - run: docker exec -i supabase_db_event-radar-local psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/s6_invariants.sql
      - run: pnpm local:env
      - run: pnpm export:mobile
      - run: pnpm check:client-bundles
      - if: always()
        run: supabase stop --no-backup
